<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>众帮后台登陆</title>

    <!-- Bootstrap core CSS -->

    <link href="css/bootstrap-reset.css" rel="stylesheet">
    <!--external css-->
    <link href="assets/font-awesome/css/font-awesome.css" rel="stylesheet" />

    <script src="http://cdn.static.runoob.com/libs/jquery/2.1.1/jquery.min.js"></script>

  <body class="login-body">

    <div class="container">

      <form class="form-signin" action="server_check/server_table.html" onsubmit="return checkForm()">
        <h2 class="form-signin-heading">众帮后台管理</h2>
        <div class="login-wrap">
            <input type="text" id="username" class="form-control" placeholder="账号" autofocus>
            <input type="password" id="password" class="form-control" placeholder="密码">
            <label class="checkbox">
                <input type="checkbox" value="remember-me"> 记住我
                <span class="pull-right"> <a href="#"> 忘记密码?</a></span>
            </label>
            <button class="btn btn-lg btn-login btn-block" type="submit">登陆</button>

        </div>

      </form>

    </div>

    <script>

        function checkForm(){

            //获取到账号和密码.
            var username = $("#username").val();
            var password = $("#password").val();
            if(username !== 'admin' || password !== 'admin'){
                alert("账号或密码错误");
                return false;
            }
            return true;
        }


    </script>

  </body>
</html>
